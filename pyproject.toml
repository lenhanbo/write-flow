[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-flow-hwg"
version = "0.1.0"
description = "Conditional Self-Flow for offline handwriting generation"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "torchvision>=0.16", "Pillow>=10", "PyYAML>=6", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

