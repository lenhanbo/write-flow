seed: 42
data:
  iam_root: /kaggle/input/iam-handwriting/IAM
  split_dir: /kaggle/input/iam-splits/splits
  resolution: [64, 256]
  batch_size: 2
  num_workers: 2
  max_text_length: 32
model:
  conditioning: writevit
  writevit_checkpoint: /kaggle/input/writevit-checkpoint/model.pth
  unifont_path: /kaggle/input/writevit-assets/unifont.pickle
  freeze_conditioning: true
  writevit_dim: 256
  writer_depth: 3
  fusion_depth: 5
  writevit_heads: 4
  style_tokens: 8
  ae_latent_channels: 8
  latent_size: [16, 64]
  patch_size: 2
  hidden_dim: 128
  depth: 6
  num_heads: 4
  student_feature_layer: 1
  teacher_feature_layer: 4
flow:
  variant: self_flow
  mask_ratio: 0.25
  rep_gamma: 0.8
  rep_warmup_steps: 2000
  ema_decay: 0.9999
  ode_solver: euler
  ode_steps: 30
train:
  device: auto
  max_steps: 20000
  smoke_steps: 5
  grad_accum_steps: 4
  lr: 0.0001
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  amp: auto
  activation_checkpointing: true
  save_every_steps: 500
